[build]
builder = "RAILPACK"
buildCommand = "cd ../.. && npm ci && npm run build --workspace=@blob/platform-api"

[deploy]
startCommand = "cd ../.. && npm run start --workspace=@blob/platform-api"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
