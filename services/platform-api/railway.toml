[build]
builder = "RAILPACK"
buildCommand = "cd ../.. && npm run build --workspace=@blob/platform-api"

[deploy]
preDeployCommand = "cd ../.. && npm run prisma:migrate:deploy --workspace=@blob/platform-api"
startCommand = "cd ../.. && npm run start --workspace=@blob/platform-api"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
