[build]
builder = "RAILPACK"
buildCommand = "case \"$RAILWAY_SERVICE_NAME\" in blob) npm run build --workspace=@blob/game-server ;; platform-api) npm run build --workspace=@blob/platform-api ;; *) echo \"Unsupported Railway service: $RAILWAY_SERVICE_NAME\" >&2; exit 64 ;; esac"

[deploy]
startCommand = "case \"$RAILWAY_SERVICE_NAME\" in blob) npm run start --workspace=@blob/game-server ;; platform-api) npm run prisma:migrate:deploy --workspace=@blob/platform-api && npm run start --workspace=@blob/platform-api ;; *) echo \"Unsupported Railway service: $RAILWAY_SERVICE_NAME\" >&2; exit 64 ;; esac"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
