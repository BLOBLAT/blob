name: Escrow Rust checks

on:
  push:
    branches: [main]
    paths:
      - "programs/blob-escrow/**"
      - ".github/workflows/escrow-rust.yml"
  pull_request:
    paths:
      - "programs/blob-escrow/**"
      - ".github/workflows/escrow-rust.yml"

permissions:
  contents: read

concurrency:
  group: escrow-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native escrow tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: programs/blob-escrow
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.1
      - run: cargo test --locked
