[toolchain]
anchor_version = "0.32.1"
solana_version = "2.3.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Non-deployable placeholder. Replace through the controlled deployment
# procedure described in programs/README.md; never commit its private key.
blob_escrow = "11111111111111111111111111111111"

[provider]
cluster = "localnet"
# This is only Anchor's local development default; it does not commit a
# keypair. Controlled deployment commands must supply their own signer.
wallet = "~/.config/solana/id.json"

[workspace]
types = "target/types"
